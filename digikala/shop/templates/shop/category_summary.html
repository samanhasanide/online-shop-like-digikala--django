{% extends 'shop/base.html' %}
{% load static %}
{% block content %}
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
    }

    .categories-container {
        width: 90%;
        max-width: 1400px;
        margin: 50px auto;
    }

    .categories-title {
        text-align: center;
        margin-bottom: 40px;
        font-size: 32px;
        color: #333;
    }

    .categories {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 30px;
    }

    .category-card {
        background-color: white;
        border-radius: 18px;
        overflow: hidden;
        text-decoration: none;
        color: #333;

        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);

        transition: 0.3s;
    }

    .category-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
    }

    .category-image {
        width: 100%;
        height: 260px;

        /* عکس بریده نشود */
        object-fit: contain;

        /* فضای اطراف عکس */
        padding: 10px;

        display: block;
        background-color: #fff;
    }

    .category-name {
        padding: 20px;
        text-align: center;
        font-size: 21px;
        font-weight: bold;
    }
</style>
</head>

<body>

    <div class="categories-container">

        <h1 class="categories-title">
            Categories
        </h1>

        <div class="categories">

            {% for category in categories %}

                <a href="{% url 'category_page' category.name %}"
                class="category-card">

                    <img
                        src="{{ category.picture.url }}"
                        alt="{{ category.name }}"
                        class="category-image"
                    >

                    <div class="category-name">
                        {{ category.name }}
                    </div>

                </a>

            {% endfor %}

        </div>

    </div>

</body>
{% endblock content %}
