{% extends 'shop/base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h3 class="mb-4">
                        My Profile
                    </h3>


                    <!-- ========================= -->
                    <!-- Username -->
                    <!-- ========================= -->

                    <div class="mb-4">

                        <label class="form-label text-muted">
                            Username
                        </label>

                        <div class="d-flex">

                            <input
                                type="text"
                                class="form-control"
                                value="{{ user.username }}"
                                disabled
                            >

                        </div>

                    </div>


                    <!-- ========================= -->
                    <!-- First Name -->
                    <!-- ========================= -->

                    <div class="mb-4">

                        <form method="POST" action="{% url 'profile' %}">

                            {% csrf_token %}

                            <input
                                type="hidden"
                                name="field"
                                value="first_name"
                            >

                            <label class="form-label text-muted">
                                First Name
                            </label>

                            <div class="d-flex">

                                <input
                                    type="text"
                                    name="value"
                                    class="form-control"
                                    value="{{ user.first_name }}"
                                    disabled
                                >

                                <button
                                    type="button"
                                    class="btn btn-outline-primary ms-2 edit-btn"
                                >
                                    Edit
                                </button>

                                <button
                                    type="submit"
                                    class="btn btn-success ms-2 save-btn"
                                    style="display: none;"
                                >
                                    Save
                                </button>

                            </div>

                        </form>

                    </div>


                    <!-- ========================= -->
                    <!-- Last Name -->
                    <!-- ========================= -->

                    <div class="mb-4">

                        <form method="POST" action="{% url 'profile' %}">

                            {% csrf_token %}

                            <input
                                type="hidden"
                                name="field"
                                value="last_name"
                            >

                            <label class="form-label text-muted">
                                Last Name
                            </label>

                            <div class="d-flex">

                                <input
                                    type="text"
                                    name="value"
                                    class="form-control"
                                    value="{{ user.last_name }}"
                                    disabled
                                >

                                <button
                                    type="button"
                                    class="btn btn-outline-primary ms-2 edit-btn"
                                >
                                    Edit
                                </button>

                                <button
                                    type="submit"
                                    class="btn btn-success ms-2 save-btn"
                                    style="display: none;"
                                >
                                    Save
                                </button>

                            </div>

                        </form>

                    </div>


                    <!-- ========================= -->
                    <!-- Email -->
                    <!-- ========================= -->

                    <div class="mb-4">

                        <form method="POST" action="{% url 'profile' %}">

                            {% csrf_token %}

                            <input
                                type="hidden"
                                name="field"
                                value="email"
                            >

                            <label class="form-label text-muted">
                                Email
                            </label>

                            <div class="d-flex">

                                <input
                                    type="email"
                                    name="value"
                                    class="form-control"
                                    value="{{ user.email }}"
                                    disabled
                                >

                                <button
                                    type="button"
                                    class="btn btn-outline-primary ms-2 edit-btn"
                                >
                                    Edit
                                </button>

                                <button
                                    type="submit"
                                    class="btn btn-success ms-2 save-btn"
                                    style="display: none;"
                                >
                                    Save
                                </button>

                            </div>

                        </form>

                    </div>


                    <!-- ========================= -->
                    <!-- Change Password -->
                    <!-- ========================= -->

                    <div class="border-top pt-4 mt-4 text-center">

                        <a
                            href="{% url 'update_password' %}"
                            class="text-decoration-none fw-semibold"
                        >
                            Change Password
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

    document.querySelectorAll('.edit-btn').forEach(function(button) {

        button.addEventListener('click', function() {

            // Find the form related to this button
            let form = button.closest('form');

            // Find the input inside this form
            let input = form.querySelector('input[name="value"]');

            // Find the save button inside this form
            let saveButton = form.querySelector('.save-btn');


            // Enable the input
            input.disabled = false;

            // Focus on the input
            input.focus();


            // Hide the Edit button
            button.style.display = 'none';

            // Show the Save button
            saveButton.style.display = 'inline-block';

        });

    });

</script>

{% endblock %}
